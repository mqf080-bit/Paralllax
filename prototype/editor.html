<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parallax — Chart Editor</title>
  </head>
  <body>
    <div id="editor">
      <header class="topbar">
        <div class="brand">
          <span class="brand__mark">PARALLAX</span>
          <span class="brand__sub">CHART EDITOR · v0.3.11</span>
        </div>

        <div class="topbar__group">
          <span class="topbar__label">TOOL</span>
          <div id="tools" class="tools"></div>
        </div>

        <label class="topbar__group">
          <span class="topbar__label">SNAP</span>
          <select id="snap" class="input"></select>
        </label>

        <div class="topbar__group snap-fields" title="DIV = 每全音符分几份；DOT = 附点 ×1.5；3 = 三连 ×2/3">
          <span class="topbar__label">DIV</span>
          <input id="snap-div" class="input input--div" type="number" min="0" max="64" step="1" value="8" />
          <button id="snap-dot" class="button button--small" type="button">DOT</button>
          <button id="snap-triplet" class="button button--small" type="button">3</button>
        </div>

        <div class="topbar__group">
          <label class="check"><input id="grid" type="checkbox" checked /><span>SNAP XZ</span></label>
          <button id="zoom-out" class="button button--small" type="button">−</button>
          <button id="zoom-in" class="button button--small" type="button">＋</button>
        </div>

        <div class="topbar__group">
          <button id="traces-toggle" class="button button--small is-active" type="button" title="trace：显示 + 吸附 / 只显示 / 关闭">TRACES ●</button>
        </div>

        <div class="topbar__group topbar__group--grow topbar__group--view">
          <button id="view-toggle" class="button button--small" type="button" title="视图与显示选项">VIEW ▾</button>
        </div>

        <div class="topbar__actions">
          <span id="issue-readout" class="save-state">OK</span>
          <button id="new" class="button button--small" type="button">NEW</button>
          <button id="import" class="button button--small" type="button">IMPORT</button>
          <button id="export" class="button button--small" type="button" title="导出单个 .parallax 谱面包（含音轨）">EXPORT</button>
          <button id="export-json" class="button button--small" type="button">JSON</button>
          <span id="save-state" class="save-state">DRAFT —</span>
        </div>
      </header>

      <div id="view-panel" class="view-panel" hidden>
        <button id="edit3d" class="button button--small is-active" type="button">3D EDIT</button>
        <button id="toggle-2d" class="button button--small is-active" type="button">2D</button>
        <button id="guide-toggle" class="button button--small is-active" type="button" title="竖直引导网（判定提示）">GUIDE</button>
        <button id="spectrum-toggle" class="button button--small" type="button" title="展开音频频谱定位">SPECTRUM</button>
        <button id="fit" class="button button--small" type="button">FIT</button>
      </div>

      <main class="work">
        <section class="preview">
          <div id="preview-hint" class="preview__hint">3D EDIT · 白点=自由 · 青点=X · 黄铜=Z · ARC 点弧加节点 · 点珠 KEY</div>
          <div id="preview" class="preview__viewport"></div>
          <div class="transport">
            <div class="transport__row">
              <button id="play" class="button transport__play" type="button">▶ PLAY</button>
              <button id="stop" class="button button--small" type="button">⏮</button>
              <span id="time-readout" class="transport__time">−0:01.000 / 0:00.000</span>
              <span id="audio-readout" class="transport__audio">SILENT</span>
            </div>
            <div class="transport__row">
              <label class="transport__field">
                <span class="topbar__label">RATE</span>
                <select id="rate" class="input">
                  <option value="0.25">0.25×</option>
                  <option value="0.5">0.5×</option>
                  <option value="0.75">0.75×</option>
                  <option value="1" selected>1×</option>
                  <option value="1.5">1.5×</option>
                  <option value="2">2×</option>
                </select>
              </label>
              <label class="transport__field" title="只影响 3D 视图的视觉流速；不改 SV、判定或音频">
                <span class="topbar__label">3D SPEED</span>
                <input id="view-speed" class="input input--range transport__speed" type="range" min="0.5" max="10" step="0.5" value="3" />
                <span id="view-speed-value" class="transport__value">3.0 m/s</span>
              </label>
              <button id="reverse" class="button button--small" type="button">REV</button>
              <label class="check"><input id="auto" type="checkbox" checked /><span>AUTO</span></label>
              <label class="check"><input id="follow" type="checkbox" checked /><span>FOLLOW</span></label>
              <label class="check"><input id="drums" type="checkbox" /><span>DRUMS</span></label>
            </div>
          </div>
        </section>

        <div id="splitter" class="splitter" role="separator" aria-orientation="vertical"></div>

        <section class="timeline">
          <div class="timeline__canvas">
            <canvas id="timeline"></canvas>
          </div>
          <div class="timeline__status">
            <span id="status-text">1 SELECT · 2 HIT · 3 DRAG · 4 HOLD · 5 ARC · 2D 左键放置/拖动 · 右键删除</span>
            <span class="timeline__keys">SPACE 播放 · ←/→ 微移 · CTRL+滚轮 缩放 · CTRL+Z 撤销</span>
          </div>
        </section>

        <aside id="inspector" class="inspector" aria-label="检查器"></aside>
      </main>

      <section id="spectrum-panel" class="spectrum" hidden aria-label="音频频谱">
        <header class="spectrum__head">
          <span class="spectrum__title">SPECTRUM</span>
          <span id="spectrum-time" class="spectrum__time">—</span>
          <span id="spectrum-status" class="spectrum__status">CLICK / DRAG TO SEEK</span>
          <button id="spectrum-close" class="button button--small" type="button">CLOSE ×</button>
        </header>

      <div id="view-panel" class="view-panel" hidden>
        <button id="edit3d" class="button button--small is-active" type="button">3D EDIT</button>
        <button id="toggle-2d" class="button button--small is-active" type="button">2D</button>
        <button id="guide-toggle" class="button button--small is-active" type="button" title="竖直引导网（判定提示）">GUIDE</button>
        <button id="spectrum-toggle" class="button button--small" type="button" title="展开音频频谱定位">SPECTRUM</button>
        <button id="fit" class="button button--small" type="button">FIT</button>
      </div>
        <div class="spectrum__body">
          <canvas id="spectrum-canvas"></canvas>
        </div>
      </section>

      <footer class="overview">
        <div class="overview__controls">
          <button id="overview-play" class="button button--small" type="button">▶</button>
          <span id="overview-time" class="overview__time">-0:01.000</span>
        </div>
        <div class="overview__canvas">
          <canvas id="overview-canvas"></canvas>
        </div>
      </footer>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>
    <input id="chart-file" type="file" accept=".parallax,.json,application/json" hidden />
    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
